[project]
name = "bulanik"
version = "0.3.0"
description = "Easy-to-use fuzzy numbers, fuzzy inference and fuzzy MCDM, with LumiX and sezgi bridges"
authors = [
    {name = "Tolga Berber", email = "tolga.berber@fen.ktu.edu.tr"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["fuzzy", "fuzzy-logic", "fuzzy-inference", "mcdm", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tdelphi1981/bulanik"
Documentation = "https://tdelphi1981.github.io/bulanik/"
Repository = "https://github.com/tdelphi1981/bulanik"
Issues = "https://github.com/tdelphi1981/bulanik/issues"
Changelog = "https://github.com/tdelphi1981/bulanik/blob/main/CHANGELOG.md"

[project.optional-dependencies]
lumix = ["lumix-opt>=0.3.2", "ortools>=9.8"]
sezgi = ["sezgi>=0.1.6"]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "lumix-opt>=0.3.2",
    "ortools>=9.8",
    "sezgi>=0.1.6",
    "matplotlib>=3.8",
]

# Docs dependency group: exact pins (MkDocs 2.0 is an announced breaking
# release). Includes the bridge extras so docs snippets that use them execute.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.8",
    "markdown-exec==1.12.3",
    "pymdown-extensions==11.0.2",
    "matplotlib==3.11.1; python_version >= '3.11'",
    "lumix-opt>=0.3.2",
    "ortools>=9.8",
    "sezgi>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers", ".github", "/benchmarks"]

[tool.hatch.build.targets.wheel]
packages = ["src/bulanik"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/bulanik"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
markers = [
    "docs: builds the MkDocs site in strict mode (needs the docs group; deselect with -m 'not docs')",
]
pythonpath = ["tests"]
filterwarnings = [
    # OR-Tools' SWIG bindings on Python 3.12+ (third-party, harmless)
    "ignore:builtin type [Ss]wig.* has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.report]
fail_under = 95

[tool.coverage.run]
source = ["bulanik"]
omit = ["*/bulanik/lumix.py", "*/bulanik/sezgi.py"]
